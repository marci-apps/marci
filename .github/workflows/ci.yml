name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the skill against the Agent Skills spec
        run: node scripts/check.mjs
      - name: Check the Claude Code plugin
        run: npx -y @anthropic-ai/claude-code plugin validate .
      - name: Check what skills.sh finds
        run: npx -y skills add . --list
      - name: Build the hosted copy
        run: node scripts/build.mjs
      - name: Check what ClawHub would publish
        run: npx -y clawhub@0.25.1 skill publish dist/site/.well-known/agent-skills/marci --slug marci --dry-run --no-input
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/site
